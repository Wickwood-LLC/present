# Schema for the configuration files of the present module.

present.settings:
  type: config_object
  label: 'Present settings'
  mapping:
    revealjs_theme:
      type: string
      label: 'Reveal.js Theme'

present.presentation.*:
  type: config_entity
  label: 'Presentation'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    revealjs_theme:
      type: string
      label: 'Theme'
    revealjs_config_options:
      type: string
      label: 'Config Options'
    events_to_track:
      type: sequence
      label: 'Events to Track'
      sequence:
        type: string
        label: 'Event'
    slides:
      type: sequence
      label: 'Slides'
      sequence:
        type: mapping
        label: 'Slide'
        mapping:
          content:
            type: string
            label: 'Content'
          type:
            type: string
            label: 'Type of Content'
          auto_animate:
            type: boolean
            label: 'Auto Animate'
          auto_animate_id:
            type: string
            label: 'Auto Animate ID'
          auto_animate_restart:
            type: boolean
            label: 'Auto Animate Restart'
          ovrride_revealjs_config_options:
            type: sequence
            label: 'Override Config Options of Slide on Events'
            sequence:
              type: string
              label: 'Override Config Options of Slide on Event'
          autoslide:
            type: number
            label: 'Auto-Slide Duration'
