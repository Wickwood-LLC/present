present.settings:
  path: '/admin/config/user-interface/present'
  defaults:
    _form: '\Drupal\present\Form\SettingsForm'
    _title: 'Present settings'
  requirements:
    _permission: 'administer site configuration'

entity.presentation.collection:
  path: '/admin/content/presentation'
  defaults:
    _entity_list: 'presentation'
    _title: 'Presentations'
  requirements:
    _permission: 'administer presentations'

entity.presentation.add_form:
  path: '/admin/content/presentation/add'
  defaults:
    _entity_form: 'presentation.add'
    _title: 'Add Presentation'
  requirements:
    _permission: 'administer presentations'

entity.presentation.edit_form:
  path: '/admin/content/presentation/{presentation}/edit'
  defaults:
    _entity_form: 'presentation.edit'
    _title: 'Edit Presentaiton'
  requirements:
    _permission: 'administer presentations'

entity.presentation.preview:
  path: '/admin/content/presentation/{presentation}/preview'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::preview'
    _title_callback: '\Drupal\present\Controller\PresentationController::previewTitle'
  requirements:
    _permission: 'administer presentations'

entity.presentation.duplicate_form:
  path: '/admin/content/presentation/{presentation}/duplicate'
  defaults:
    _entity_form: 'presentation.duplicate'
    _title: 'Duplicate Presentaiton'
  requirements:
    _permission: 'administer presentations'

entity.presentation.delete_form:
  path: '/admin/content/presentation/{presentation}/delete'
  defaults:
    _entity_form: 'presentation.delete'
    _title: 'Delete Presentations'
  requirements:
    _permission: 'administer presentations'

present.presentation_event:
  path: '/ajax/presentation/event'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::event'
    _title: 'Presentation Event'
  requirements:
    _access: 'TRUE'
    _format: 'json'
    _method: 'POST'
