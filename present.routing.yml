present.vimeo_even:
  path: '/ajax/present/vimeo-event'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::vimeoEvent'
    _title: 'Vimeo Event'
  requirements:
    _access: 'TRUE'
    _format: 'json'
    _method: 'POST'

route_callbacks:
  - 'present.route_subscriber:routes'

entity.presentation.collection:
  path: '/admin/structure/presentation'
  defaults:
    _entity_list: 'presentation'
    _title: 'Presentation'
  requirements:
    _permission: 'administer presentations'

entity.presentation.add_form:
  path: '/admin/structure/presentation/add'
  defaults:
    _entity_form: 'presentation.add'
    _title: 'Add My Configuration Entity'
  requirements:
    _permission: 'administer presentations'

entity.presentation.edit_form:
  path: '/admin/structure/presentation/{presentation}/edit'
  defaults:
    _entity_form: 'presentation.edit'
    _title: 'Edit Presentaiton'
  requirements:
    _permission: 'administer presentations'

entity.presentation.delete_form:
  path: '/admin/structure/presentation/{presentation}/delete'
  defaults:
    _entity_form: 'presentation.delete'
    _title: 'Delete Presentations'
  requirements:
    _permission: 'administer presentations'