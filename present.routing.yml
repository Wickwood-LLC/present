present.presentation:
  path: '/capstone-health/plus/generic-presentation/{user}'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::present'
    _title: 'Presentation'
    user: 0
  requirements:
    _permission: 'access content'
  options:
    parameters:
      user:
        converter: 'present.user_code'

present.presentation_registration:
  path: '/capstone-health/presentation-registration'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::registration'
    _title: 'Register for Presentation'
  requirements:
    _permission: 'access content'

present.vimeo_even:
  path: '/ajax/present/vimeo-event'
  defaults:
    _controller: '\Drupal\present\Controller\PresentationController::vimeoEvent'
    _title: 'Vimeo Event'
  requirements:
    _access: 'TRUE'
    _format: 'json'
    _method: 'POST'
